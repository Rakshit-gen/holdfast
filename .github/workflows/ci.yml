name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod
      - name: fuzz the BGP parser
        run: go test -run XXX -fuzz FuzzRead -fuzztime 30s ./bgp
      - name: scripts
        run: for f in scripts/*.sh; do sh -n "$f"; done

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: install gobgp
        run: go install github.com/osrg/gobgp/v3/cmd/gobgpd@v3.37.0 github.com/osrg/gobgp/v3/cmd/gobgp@v3.37.0
      - name: interop
        run: PATH="$(go env GOPATH)/bin:$PATH" scripts/interop.sh
