# BIRD 2 on a site's edge router, peering with holdfast on 192.0.2.10.
# Accept only the anycast prefixes holdfast is allowed to announce, and
# honour the GRACEFUL_SHUTDOWN community (RFC 8326) so traffic moves away
# before holdfast withdraws. holdfast's tests run GoBGP, not BIRD, so check
# this with `bird -p` before using it.

define HOLDFAST_V4 = [ 198.51.100.0/24{24,32} ];
define HOLDFAST_V6 = [ 2001:db8:53::/48{48,128} ];

filter holdfast_in {
	if net.type = NET_IP4 && net !~ HOLDFAST_V4 then reject;
	if net.type = NET_IP6 && net !~ HOLDFAST_V6 then reject;
	if (65535, 0) ~ bgp_community then bgp_local_pref = 0;
	accept;
}

protocol bgp holdfast {
	local as 64513;
	neighbor 192.0.2.10 as 64512;
	hold time 90;
	ipv4 { import filter holdfast_in; export none; import limit 100 action restart; };
	ipv6 { import filter holdfast_in; export none; import limit 100 action restart; };
}
